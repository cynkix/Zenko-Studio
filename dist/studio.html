/* Layout concept: three-pane studio (plan · canvas · inspector) that grows a live phone preview on large screens;
   Play swaps the inspector for real phones next to a canvas that follows each operator. */
:root {
  --bg: #F6F5F3; --surface: #FFFFFF; --surface2: #F2F0ED; --sunk: #E9E6E2; --line: #E2DED9; --line2: #CFCAC4;
  --fg: #1B1A1F; --mut: #5E5C66; --mut2: #8A8791;
  --accent: #E2001A; --accent-h: #B80016; --accent-fg: #FFFFFF; --accent-soft: #FDE6E9; --accent-t: #C20017; --on: #FFFFFF;
  --ba: #0F766E; --ba-soft: #D9F1EE; --ba-on: #FFFFFF; --bb: #C2410C; --bb-soft: #FBE5D8; --bb-on: #FFFFFF; --bc: #6D28D9; --bc-soft: #EBE2FB; --bc-on: #FFFFFF;
  --ok: #157F3B; --ok-soft: #DCF0E2; --warn: #9A5806; --err: #B42318; --err-soft: #FADFDA;
  --edge: #9C98A2; --canvas: #F1EFEC; --dot: #D3CEC8;
  --shadow: 0 1px 2px rgba(27,26,31,.06), 0 12px 28px -16px rgba(27,26,31,.28);
  --f-ui: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-disp: 'Montserrat', 'Noto Sans', system-ui, sans-serif;
  --r: 12px; --r-lg: 16px;
  --lw: 270px; --rw: 340px; --dw: 0px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121115; --surface: #1B1A20; --surface2: #222127; --sunk: #16151A; --line: #2D2B33; --line2: #3F3C47;
  --fg: #F2F0F4; --mut: #A6A3AE; --mut2: #77747F;
  --accent: #F0364B; --accent-h: #FF5A6B; --accent-fg: #FFFFFF; --accent-soft: #3B1219; --accent-t: #FF7482; --on: #121115;
  --ba: #4FD1C5; --ba-soft: #11302D; --ba-on: #06201D; --bb: #FFA46B; --bb-soft: #3F2112; --bb-on: #2A1204; --bc: #B794F6; --bc-soft: #2A1D49; --bc-on: #1A0B3A;
  --ok: #52DF86; --ok-soft: #12301E; --warn: #F5B84F; --err: #FF8173; --err-soft: #3C1B17;
  --edge: #5A5763; --canvas: #17161B; --dot: #26242C; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121115; --surface: #1B1A20; --surface2: #222127; --sunk: #16151A; --line: #2D2B33; --line2: #3F3C47;
  --fg: #F2F0F4; --mut: #A6A3AE; --mut2: #77747F;
  --accent: #F0364B; --accent-h: #FF5A6B; --accent-fg: #FFFFFF; --accent-soft: #3B1219; --accent-t: #FF7482; --on: #121115;
  --ba: #4FD1C5; --ba-soft: #11302D; --ba-on: #06201D; --bb: #FFA46B; --bb-soft: #3F2112; --bb-on: #2A1204; --bc: #B794F6; --bc-soft: #2A1D49; --bc-on: #1A0B3A;
  --ok: #52DF86; --ok-soft: #12301E; --warn: #F5B84F; --err: #FF8173; --err-soft: #3C1B17;
  --edge: #5A5763; --canvas: #17161B; --dot: #26242C; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7);
  color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: .92em; }
.ic { flex: none; }
.mut { color: var(--mut); } .sp { flex: 1; }
kbd { font: 600 10.5px var(--f-mono); padding: 1px 5px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; color: var(--mut); background: var(--surface2); }

/* ---------- shell ---------- */
.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.top { flex: none; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30; }
.logo { font-weight: 700; display: flex; align-items: center; gap: 9px; font-family: var(--f-disp); font-size: 16px; letter-spacing: -.01em; }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo b { font-weight: 700; } .logo em { font-style: normal; color: var(--mut); font-weight: 500; }
.views { display: flex; gap: 2px; padding: 3px; background: var(--sunk); border-radius: 9px; }
.views button { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 5px 10px; border-radius: 7px; color: var(--mut); font-weight: 600; }
.views button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.crumb { display: flex; align-items: center; gap: 8px; position: relative; margin-left: 6px; min-width: 0; color: var(--mut); }
.crumb .sw { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none; padding: 5px 8px; border-radius: 8px; max-width: 100%; }
.crumb .sw:hover { background: var(--surface2); border-color: var(--line); }
.crumb .t { font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font: 600 10.5px var(--f-ui); padding: 2px 7px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); color: var(--mut); white-space: nowrap; }
.chip.okc { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pop { position: absolute; z-index: 60; background: var(--surface); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
.sw-pop { top: 40px; left: 0; min-width: 260px; }
.sw-pop button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 8px; text-align: left; }
.sw-pop button:hover, .sw-pop button.on { background: var(--surface2); }
.sw-pop span { color: var(--mut); font-size: 12px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border-radius: 10px; }
.seg button { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 0; background: none; border-radius: 8px; font-weight: 600; color: var(--mut); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.seg.mode { margin-left: 4px; }
.seg.mode button.play.on { background: var(--accent); color: var(--accent-fg); }
.seg.sm button { padding: 4px 9px; font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; padding: 4px 9px; border-radius: 99px; cursor: pointer; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--err-soft); color: var(--err); }
.ib { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid transparent; background: none; border-radius: 8px; color: var(--mut); flex: none; }
.ib:hover:not(:disabled) { background: var(--surface2); color: var(--fg); border-color: var(--line); }
.ib:disabled { opacity: .35; } .ib.on { background: var(--accent-soft); color: var(--accent); }
.kbtn { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface2); color: var(--mut); }
.kbtn:hover { border-color: var(--mut2); color: var(--fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line2); background: var(--surface); border-radius: 8px; font-weight: 600; color: var(--fg); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--mut2); background: var(--surface2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.pri:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
.btn.off, .btn:disabled { opacity: .45; }
.btn.dng { color: var(--err); } .btn.block { width: 100%; margin-top: 8px; }
.rel { position: relative; }
.view-pop { right: 0; top: 40px; width: 270px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.pg { font: 700 11px var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin-top: 4px; }
.ph { font-size: 12px; color: var(--mut); }
.chk { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.seg.sm { width: 100%; } .seg.sm button { flex: 1; justify-content: center; }
.ptools .seg.sm, .drawer .seg.sm { width: auto; }

.work { flex: 1; min-height: 0; display: flex; position: relative; }
.side { flex: 0 0 var(--lw); min-width: 0; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.insp { flex: 0 0 var(--rw); min-width: 0; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.dock { flex: 0 0 var(--dw); min-width: 0; background: var(--sunk); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.center { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.work.is-play .side { display: none; }
.bp-l { --lw: 300px; --rw: 380px; --dw: 400px; } .bp-xl { --lw: 340px; --rw: 440px; --dw: 540px; font-size: 14.5px; }
.bp-xl .nd { zoom: 1; }

.side-in, .insp-in { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.stabs { flex: none; display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.stabs button { display: inline-flex; align-items: center; gap: 6px; padding: 8px 8px; border: 0; background: none; color: var(--mut); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.stabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.stabs .dot { font: 700 10px var(--f-ui); font-style: normal; min-width: 16px; height: 16px; padding: 0 4px; display: inline-grid; place-items: center; border-radius: 99px; }
.dot.ok { background: var(--ok-soft); color: var(--ok); } .dot.bad { background: var(--err-soft); color: var(--err); }
.side-scroll, .insp-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }
.sh { font: 700 11px var(--f-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--mut); margin: 14px 2px 8px; }
.sh:first-child { margin-top: 2px; }
.sg { font: 600 11.5px var(--f-ui); color: var(--mut2); margin: 10px 2px 6px; }
.li { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 10px; margin-bottom: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; }
.li:hover { border-color: var(--line2); background: var(--surface2); }
.li.on { border-color: var(--accent); background: var(--accent-soft); }
.li.root:not(.on) { border-color: var(--line2); }
.li.ghost { flex-direction: row; align-items: center; gap: 8px; border-style: dashed; color: var(--mut); font-weight: 600; }
.li-t { display: flex; flex-direction: column; } .li-t span { color: var(--mut); font-size: 12px; }
.li-m { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.hintp { color: var(--mut); font-size: 12.5px; margin: 10px 2px; line-height: 1.5; }
.outline { display: flex; flex-direction: column; gap: 1px; }
.ol { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: none; border-radius: 7px; color: var(--fg); position: relative; min-width: 0; }
.ol span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol .ic { color: var(--mut); }
.ol:hover { background: var(--surface2); } .ol.on { background: var(--accent-soft); }
.ol-b { font: 700 10px var(--f-ui); font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: var(--on); flex: none; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pt { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; text-align: left; font-weight: 500; min-width: 0; }
.pt:hover { border-color: var(--accent); background: var(--accent-soft); }
.pt .ic { color: var(--accent); } .pt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- canvas ---------- */
.stage-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cv { position: relative; flex: 1; min-height: 0; }
.cv > .react-flow { position: absolute; inset: 0; }
.cv-tools { position: absolute; z-index: 6; top: 12px; left: 12px; display: flex; gap: 6px; }
.stage-wrap.dual .cv-tools { left: auto; right: 12px; top: 9px; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; font-weight: 600; box-shadow: var(--shadow); }
.tb:hover { border-color: var(--mut2); } .tb.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tb i { font: 700 10.5px var(--f-ui); font-style: normal; background: var(--accent-soft); color: var(--accent); padding: 0 6px; border-radius: 99px; line-height: 17px; }
.tb.on i { background: rgba(255,255,255,.22); color: inherit; }
.subbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--mut); }
.subbar button { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line2); background: var(--surface2); border-radius: 7px; padding: 3px 9px; font-weight: 600; color: var(--fg); }
.subbar b { color: var(--fg); font-family: var(--f-mono); } .subbar em { font-style: normal; margin-left: auto; }
.react-flow { background: var(--canvas); --xy-edge-stroke-default: var(--edge); }
.react-flow__background circle { fill: var(--dot); }
.react-flow__controls { box-shadow: var(--shadow); border-radius: 9px; overflow: hidden; border: 1px solid var(--line2); }
.react-flow__controls-button { background: var(--surface); color: var(--fg); border-bottom: 1px solid var(--line); fill: currentColor; width: 28px; height: 28px; }
.react-flow__controls-button:hover { background: var(--surface2); }
.react-flow__controls-button svg { fill: currentColor; max-width: 13px; max-height: 13px; }
.react-flow__minimap { background: var(--surface); border: 1px solid var(--line2); border-radius: 9px; box-shadow: var(--shadow); overflow: hidden; }
.react-flow__handle { opacity: 0; width: 6px; height: 6px; min-width: 0; min-height: 0; }
.react-flow__edge-path { transition: opacity .2s; }
.react-flow__node { cursor: pointer; }
.nd { position: relative; width: 260px; min-height: 62px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line2); border-radius: 11px; box-shadow: var(--shadow); font-size: 13px; transition: box-shadow .15s, border-color .15s, opacity .2s; }
.nd:hover { border-color: var(--mut2); }
.nd.br { border-color: var(--c); background: color-mix(in srgb, var(--cs) 38%, var(--surface)); }
.nd.sel { outline: 2px solid var(--accent); outline-offset: 3px; }
.nd-ic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--surface2); color: var(--mut); border: 1px solid var(--line); }
.nd.br .nd-ic { background: var(--cs); color: var(--c); border-color: transparent; }
.nd-tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.nd-t { font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.nd-t b { color: var(--accent); } .nd-t code { background: var(--surface2); padding: 0 4px; border-radius: 4px; }
.nd-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; font-size: 11px; color: var(--mut); }
.nd-k { font-family: var(--f-mono); font-size: 10.5px; color: var(--mut); background: var(--surface2); padding: 0 5px; border-radius: 4px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nd-ty { white-space: nowrap; }
.nd-run { font-weight: 700; color: var(--accent); }
.lnk { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); font-family: var(--f-mono); font-size: 11px; font-weight: 600; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.nd-req { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--err); }
.nd-br { position: absolute; top: -10px; left: -10px; min-width: 22px; height: 20px; padding: 0 4px; border-radius: 99px; white-space: nowrap; background: var(--c); color: var(--con, var(--on)); font: 700 9.5px var(--f-disp); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--canvas); }
.nd.loop { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
/* sous-routine dépliée */.nd.ghost { background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); border-style: dashed; width: 236px; box-shadow: none; }
.nd.ghost::before { content: ""; position: absolute; left: -9px; top: -4px; bottom: -4px; width: 3px; border-radius: 3px; background: var(--c, var(--accent)); opacity: .8; }
.nd.ghost .nd-br { display: none; }
.gh-tag { position: absolute; top: -9px; right: 10px; display: inline-flex; align-items: center; gap: 3px; padding: 0 7px; height: 17px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-t); font: 700 9.5px var(--f-disp); }
.nd.loop .nd-ic { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.nd.fork, .nd.join { border-style: dashed; min-height: 54px; background: var(--surface2); }
.nd.term { width: 120px; min-height: 36px; justify-content: center; border-radius: 99px; font-weight: 700; color: var(--mut); gap: 6px; padding: 6px; background: var(--surface); }
.bchip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 2px; border-radius: 99px; background: var(--cs); color: var(--c); font: 600 11px var(--f-ui); }
.bchip i { font-style: normal; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; background: var(--c); color: var(--con, var(--on)); display: grid; place-items: center; font-size: 10px; }
.nd.done { border-color: var(--ok); } .nd.done.br { border-color: var(--c); }
.nd.act { border-color: var(--ac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 28%, transparent), var(--shadow); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--ac) 10%, transparent), var(--shadow); } }
.nd-pl { position: absolute; top: -10px; right: -8px; display: flex; gap: 3px; }
.nd-pb { min-width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; color: var(--on); font: 700 11px var(--f-ui); box-shadow: 0 0 0 2px var(--canvas); padding: 0 5px; }
.nd-done { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: var(--on); box-shadow: 0 0 0 2px var(--canvas); }
.edge-plus { position: absolute; pointer-events: all; }
.edge-plus button { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); padding: 0; transition: opacity .15s, transform .15s, background .15s; }
.edge-plus button:hover, .edge-plus button:focus-visible { opacity: 1; transform: scale(1.2); background: var(--accent); color: var(--accent-fg); }
@media (prefers-reduced-motion: reduce) { .nd.act { animation: none; } * { transition: none !important; } }

/* ---------- parallel view ---------- */
.pv { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--canvas); }
.pv-ctx { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 190px 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 49px; }
.pv-ctx.after { border-bottom: 0; border-top: 1px solid var(--line); padding-right: 14px; }
.pv-l { font: 700 11px var(--f-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--mut); }
.pv-chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; } .pv-chips em { color: var(--mut2); font-style: normal; }
.cchip { border: 1px solid var(--line); background: var(--surface2); border-radius: 99px; padding: 2px 10px; font-size: 12px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cchip:hover { border-color: var(--mut2); } .cchip.on { background: var(--accent-soft); border-color: var(--accent); }
.pv-fork, .pv-join { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; margin-left: auto; padding: 3px 10px; border: 1.5px dashed var(--line2); border-radius: 8px; }
.pv-join { margin: 0 auto 0 0; } .pv-fork select { border: 0; background: none; font-weight: 700; }
.pv-panes { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 12px; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); border: 1.5px solid var(--c); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.pane header { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--cs); color: var(--c); }
.pane header i { font-style: normal; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: var(--con, var(--on)); display: grid; place-items: center; font-size: 12px; }
.pane header b { font-family: var(--f-disp); font-size: 15px; } .pane header span { color: var(--mut); font-size: 12px; } .pane header .lnk { margin-left: auto; font-family: var(--f-ui); font-size: 12px; color: var(--c); }
.pane-cv { flex: 1; min-height: 0; position: relative; } .pane-cv .react-flow { position: absolute; inset: 0; background: var(--surface); }
.pane-cv .react-flow__controls { display: none; }
.pane-empty { height: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; color: var(--mut); }
.pane footer { flex: none; padding: 8px 10px; border-top: 1px solid var(--line); } .pane footer .btn { margin: 0; }

/* ---------- inspector ---------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 36px 16px; color: var(--mut); }
.empty b { color: var(--fg); font-family: var(--f-disp); font-size: 16px; } .empty p { margin: 0; max-width: 28ch; } .empty.sm { padding: 18px; }
.nf-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; } .nf-h h2 { margin: 0; font: 700 17px var(--f-disp); letter-spacing: -.01em; flex: 1; min-width: 0; }
.nf-a { display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.fld { display: flex; flex-direction: column; gap: 5px; margin: 0 0 12px; min-width: 0; flex: 1; }
.fl { font-weight: 600; font-size: 12.5px; } .fh { font-size: 12px; color: var(--mut); }
.in { width: 100%; padding: 7px 9px; border: 1px solid var(--line2); background: var(--surface); border-radius: 8px; min-width: 0; }
textarea.in { resize: vertical; } .in:hover { border-color: var(--mut2); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; } .row .fld { margin-bottom: 12px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.oc { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 99px; background: var(--surface2); padding-left: 10px; }
.oc input { border: 0; background: none; padding: 4px 0; min-width: 40px; max-width: 150px; outline-offset: 4px; }
.oc button { border: 0; background: none; padding: 4px 8px 4px 4px; color: var(--mut); display: grid; place-items: center; }
.oc.add { padding: 4px 10px; gap: 4px; color: var(--accent); font-weight: 600; border-style: dashed; background: none; }
.tgs { display: flex; gap: 18px; flex-wrap: wrap; }
.tog { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.tog input { position: absolute; opacity: 0; width: 0; height: 0; }
.tog i { width: 32px; height: 19px; border-radius: 99px; background: var(--line2); position: relative; transition: background .15s; }
.tog i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tog input:checked + i { background: var(--accent); } .tog input:checked + i::after { transform: translateX(13px); }
.tog input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.brow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; } .brow i { font-style: normal; font-weight: 700; width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--c); color: var(--con, var(--on)); display: grid; place-items: center; font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.stats div { padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); display: flex; flex-direction: column; }
.stats b { font: 700 22px var(--f-disp); font-variant-numeric: tabular-nums; } .stats span { color: var(--mut); font-size: 12px; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.ck { display: flex; gap: 9px; align-items: flex-start; padding: 9px 10px; border-radius: 9px; } .ck .ic { margin-top: 2px; }
.ck.ok { background: var(--ok-soft); color: var(--ok); } .ck.bad { background: var(--err-soft); color: var(--err); font-weight: 600; } .ck span { color: var(--fg); }

/* ---------- dock (grand écran) ---------- */
.dock-h { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
.dock-h b { font-family: var(--f-disp); font-size: 14px; } .dock-h span { color: var(--mut); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.dock-b { flex: 1; min-height: 0; padding: 10px; } .dock-go { flex: none; margin: 0 12px 12px; padding: 9px; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 9px; font-weight: 700; display: flex; justify-content: center; gap: 7px; align-items: center; }
.dock-go:hover { background: var(--accent); color: var(--accent-fg); }

/* ---------- play ---------- */
.play { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
.bp-l .play, .bp-xl .play { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.play-flow { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.pf-h2 { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pf-h2 b { font: 700 14px var(--f-disp); } .pf-h2 > span { color: var(--mut); font-size: 12px; }
.legend { margin-left: auto; display: flex; gap: 10px; } .legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.legend i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--tc); color: var(--on); display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.play-stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--sunk); }
.ptools { flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.stage { flex: 1; min-height: 0; padding: 12px; }
.drawer { flex: none; height: 200px; display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px; gap: 8px; }
.drawer.static { height: auto; max-height: 40vh; margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; }
.dr-b { flex: 1; min-height: 0; overflow: auto; font-size: 12.5px; }
.kv { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--line); } .kv code { color: var(--accent); flex: none; } .kv span { min-width: 0; overflow-wrap: anywhere; color: var(--mut); }
.tr { padding: 2px 0; color: var(--mut); } .tr.fork { color: var(--ba); font-weight: 600; } .tr.ok { color: var(--ok); } .tr.wait { color: var(--warn); }
.stage-col { display: flex; flex-direction: column; height: 100%; min-height: 0; } .stage-fit { flex: 1; min-height: 0; }
.fit { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; } .fit-in { position: absolute; left: 50%; top: 50%; transform-origin: center; }
.phones { display: flex; justify-content: center; align-items: flex-start; height: 100%; padding: 0 10px; }
.phone-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.who { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 5px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--tc); font-weight: 700; }
.who i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: var(--tc); color: var(--on); display: grid; place-items: center; font-size: 12px; } .who span { color: var(--mut); font-weight: 500; }
.tabs { flex: none; display: flex; gap: 6px; padding: 0 0 8px; justify-content: center; flex-wrap: wrap; }
.tabs button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 5px; border: 1.5px solid var(--line2); background: var(--surface); border-radius: 99px; font-weight: 700; }
.tabs button i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--tc); color: var(--on); display: grid; place-items: center; font-size: 11px; }
.tabs button em { font-style: normal; font-weight: 500; color: var(--mut); font-size: 11.5px; } .tabs button.on { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, var(--surface)); }

/* ---------- phone ---------- */
.phone { width: 340px; height: 700px; position: relative; display: flex; flex-direction: column; background: var(--surface); color: var(--fg); border: 10px solid #0A0D0C; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 2px #2A322F, 0 28px 50px -20px rgba(0,0,0,.55); --tc: var(--accent); }
.ph-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 22px; background: #0A0D0C; border-radius: 0 0 14px 14px; z-index: 5; }
.ph-top { flex: none; display: flex; align-items: center; gap: 8px; padding: 34px 14px 10px; border-bottom: 1px solid var(--line); }
.ph-back { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: var(--surface2); border-radius: 50%; flex: none; } .ph-back.hid { visibility: hidden; }
.ph-ttl { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.2; } .ph-ttl b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ph-ttl span { font-size: 11.5px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-loop { font: 600 11px var(--f-ui); border: 1px solid var(--line2); border-radius: 99px; padding: 1px 8px; color: var(--mut); }
.ph-br { width: 22px; height: 22px; border-radius: 50%; background: var(--tc); color: var(--on); font: 700 11px var(--f-ui); display: grid; place-items: center; }
.ph-off { font: 600 10.5px var(--f-ui); color: var(--warn); border: 1px solid var(--warn); border-radius: 99px; padding: 1px 8px; }
.ph-prog { flex: none; height: 3px; background: var(--sunk); } .ph-prog i { display: block; height: 100%; background: var(--tc); transition: width .3s; }
.ph-body { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 18px; display: flex; flex-direction: column; justify-content: center; }
.ph-body.inbox { justify-content: flex-start; gap: 10px; }
.ph-foot { flex: none; padding: 12px 16px 18px; border-top: 1px solid var(--line); }
.pf-center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.pf-field { animation: slidein .22s ease-out; } @keyframes slidein { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
.pf-h { font: 700 22px/1.2 var(--f-disp); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.pf-help { margin: 4px 0 0; color: var(--mut); line-height: 1.5; } .pf-center .pf-help { margin: 0; }
.pf-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--mut2); margin-top: 6px; } .pf-meta .req { color: var(--err); font-weight: 600; }
